<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">

<title>RST Electronics ERP v8 — Inventoria Better Edition</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#fff;--ink:#142033;--muted:#64748b;--line:#e2e8f0;
  --brand:#4f46e5;--brand2:#7c3aed;--good:#059669;--warn:#d97706;--bad:#dc2626;
  --nav:#0b1220;--nav2:#111a2b;--radius:16px;--shadow:0 10px 35px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.app{min-height:100vh;display:flex}
.sidebar{width:270px;background:linear-gradient(180deg,var(--nav),#0d1728 68%,#0a1020);color:#cbd5e1;position:fixed;left:0;top:0;bottom:0;z-index:50;overflow:auto}
.brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-badge{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:white;font-weight:900}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-title{font-weight:900;color:#fff;font-size:16px}
.brand-sub{font-size:10px;color:#94a3b8;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.nav{padding:14px 12px}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#64748b;padding:14px 10px 8px}
.nav button{width:100%;display:flex;gap:11px;align-items:center;border:0;background:transparent;color:#cbd5e1;padding:10px 12px;border-radius:11px;margin:3px 0;text-align:left;font-weight:700;font-size:13px}
.nav button:hover,.nav button.active{background:rgba(99,102,241,.18);color:#fff}
.nav .ic{width:20px;text-align:center}
.main{margin-left:270px;flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.top-left{display:flex;align-items:center;gap:12px}
.topbar h1{margin:0;font-size:17px}
.kbd{padding:4px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;background:#fff;color:var(--muted);font-size:10px}
.content{padding:22px;max-width:1600px;margin:auto}
.grid{display:grid;gap:16px}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-body{padding:18px}
.stat{padding:18px;position:relative;overflow:hidden}
.stat .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.stat .value{font-size:27px;font-weight:900;margin-top:7px}
.stat .hint{font-size:11px;color:var(--muted);margin-top:7px}
.stat .icon{position:absolute;right:16px;top:14px;font-size:26px;opacity:.28}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:10px;font-weight:800;font-size:12px}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,23,42,.08)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.btn.good{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.btn.warn{background:#fff7ed;border-color:#fed7aa;color:#b45309}
.btn.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.btn.dark{background:#0f172a;color:#fff;border-color:#0f172a}
.btn.ghost{background:transparent}
.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.col12{grid-column:span 12}.col8{grid-column:span 8}.col6{grid-column:span 6}.col4{grid-column:span 4}.col3{grid-column:span 3}
.label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted);margin:0 0 6px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px 13px;border-bottom:1px solid #eef2f7;font-size:12px;text-align:left;vertical-align:middle}
th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;background:#f8fafc;position:sticky;top:0;z-index:1}
tr:hover td{background:#fafcff}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}
.b-good{background:#ecfdf5;color:#047857}.b-warn{background:#fff7ed;color:#b45309}.b-bad{background:#fef2f2;color:#b91c1c}.b-blue{background:#eef2ff;color:#4338ca}.b-gray{background:#f1f5f9;color:#475569}
.search{width:min(420px,45vw)}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;z-index:100;padding:20px}
.modal{width:min(1100px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 35px 90px rgba(2,6,23,.35)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}
.tab{border:0;background:#f8fafc;padding:8px 11px;border-radius:9px;font-weight:800;font-size:11px;color:#475569}
.tab.active{background:#eef2ff;color:#4338ca}
.empty{padding:36px;text-align:center;color:var(--muted)}
.notice{padding:12px 14px;border-radius:11px;background:#eef2ff;color:#3730a3;font-size:12px}
.notice.warn{background:#fff7ed;color:#9a3412}.notice.good{background:#ecfdf5;color:#065f46}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.list{display:flex;flex-direction:column;gap:8px}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px}
.small{font-size:11px}.muted{color:var(--muted)}
.right{text-align:right}
.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.footer-note{font-size:10px;color:#94a3b8;padding:20px;text-align:center}
.mobile-only{display:none}
.login-screen{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#eef2ff,#f8fafc 45%,#eef2f7)}
.login-card{width:min(420px,92vw);background:#fff;padding:26px;border:1px solid var(--line);border-radius:20px;box-shadow:0 25px 70px rgba(15,23,42,.15)}
.logo-xl{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:22px;font-weight:900;margin:0 auto 14px}
@media(max-width:1100px){.grid4,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-only{display:block}.topbar{padding:0 14px}}
@media(max-width:720px){.content{padding:12px}.grid4,.grid2,.kpis{grid-template-columns:1fr}.search{width:100%}.form-grid{grid-template-columns:1fr 1fr}.col12,.col8,.col6,.col4,.col3{grid-column:span 2}.topbar{height:auto;min-height:68px;gap:8px}.topbar h1{font-size:14px}.toolbar{width:100%}}
</style>
</head>

let state=loadState();
let page='dashboard';
let modalOpen=false;

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){return deepMerge(JSON.parse(raw),defState);}
  }catch(e){}
  return JSON.parse(JSON.stringify(defState));
}
function deepMerge(a,b){
  if(Array.isArray(a)||Array.isArray(b)) return a!==undefined?a:b;
  if(a&&typeof a==='object'&&b&&typeof b==='object'){
    const o={...b};
    Object.keys(a).forEach(k=>o[k]=deepMerge(a[k],b[k]));
    return o;
  }
  return a!==undefined?a:b;
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return Number(v||0).toFixed(state.settings.decimals)+' '+state.settings.currency}
function num(v){return Number.parseFloat(v)||0}
function today(){return new Date().toISOString().slice(0,10)}
function sum(arr,fn){return arr.reduce((s,x)=>s+num(fn(x)),0)}
function totalInvoiceBalance(i){return Math.max(0,num(i.total)-num(i.paid))}
function statusBadge(s){
  const cls=(s==='Paid'||s==='Confirmed'||s==='Completed'||s==='Received')?'b-good':(s==='Pending'||s==='Partially Paid'||s==='Draft'||s==='Scheduled')?'b-warn':(s==='Cancelled'||s==='Overdue')?'b-bad':'b-blue';
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function log(msg){
  state.activity.unshift({id:uid(),date:new Date().toLocaleString(),msg});
  state.activity=state.activity.slice(0,120);
  save();
}
function toast(msg){
  const x=document.createElement('div');
  x.style.cssText='position:fixed;right:18px;bottom:18px;z-index:999;background:#0f172a;color:#fff;padding:12px 15px;border-radius:11px;font-weight:800;font-size:12px;box-shadow:0 10px 35px rgba(0,0,0,.2)';
  x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2500);
}
function htmlField(label,name,value='',type='text',extra=''){
  return `<div class="col6"><label class="label">${label}</label><input class="input" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
}
function selectField(label,name,options,value=''){
  return `<div class="col6"><label class="label">${label}</label><select class="select" name="${name}">${options.map(o=>`<option ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
}
function openModal(title,body,foot=''){
  modalOpen=true;
  document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="modalBg"><div class="modal">
    <div class="modal-head"><h3 style="margin:0;font-size:16px">${esc(title)}</h3><button class="btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}
  </div></div>`;
}
function closeModal(){modalOpen=false;document.getElementById('modal-root').innerHTML='';}
function downloadFile(name,content,type='application/json'){
  const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function printHtml(title,body){
  const w=window.open('','_blank');
  if(!w){toast('Popup blocked — allow popups to print');return}
  w.document.write(`<!doctype html><html><head><title>${esc(title)}</title><style>
  body{font-family:Arial,sans-serif;color:#111;padding:30px}h1{font-size:22px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:7px;font-size:12px}th{background:#f1f5f9;text-align:left}.right{text-align:right}.muted{color:#666}
  .head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:18px}.small{font-size:11px}
  </style></head><body>${body}<script>window.print()<\/script></body></html>`);
  w.document.close();
}
function docLinesTable(lines){
  return `<table><thead><tr><th>#</th><th>Item</th><th>Qty</th><th class="right">Price</th><th class="right">Total</th></tr></thead><tbody>${
    lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td><td>${l.qty}</td><td class="right">${money(l.price)}</td><td class="right">${money(l.price*l.qty)}</td></tr>`).join('')
  }</tbody></table>`;
}
function printInvoice(inv){
  const body=`<div class="head"><div><h1>${esc(state.settings.business)}</h1><div class="small">${esc(state.settings.legal)}<br>${esc(state.settings.address)}<br>${esc(state.settings.phone)} ${esc(state.settings.email)}</div></div><div><h1>INVOICE</h1><div class="small">No: ${esc(inv.no)}<br>Date: ${esc(inv.date)}<br>Due: ${esc(inv.due)}</div></div></div>
  <p><b>Bill To:</b> ${esc(inv.customer)}</p>${docLinesTable(inv.lines)}
  <div style="margin-top:18px;max-width:300px;margin-left:auto"><p class="right">Subtotal: ${money(inv.subtotal)}</p><p class="right">Tax: ${money(inv.tax)}</p><h2 class="right">Total: ${money(inv.total)}</h2><p class="right">Paid: ${money(inv.paid)}</p><p class="right"><b>Balance: ${money(totalInvoiceBalance(inv))}</b></p></div>
  <hr><div class="small">${esc(state.settings.invoiceNotes)}</div>`;
  printHtml(inv.no,body);
}
function printQuote(q){

  printHtml(q.no,body);
}
function renderLogin(){
  document.getElementById('root').innerHTML=`<div class="login-screen"><div class="login-card">
    <div class="logo-xl">RST</div><h2 style="text-align:center;margin:0 0 6px;font-size:24px">RST Electronics ERP</h2>

    <form id="loginForm" style="margin-top:20px">
      <label class="label">Username</label><input class="input" name="u" value="admin">
      <label class="label" style="margin-top:12px">Password</label><input class="input" name="p" type="password" value="admin">
      <button class="btn primary" style="width:100%;margin-top:16px">Secure Login</button>
    </form>
    <div class="notice" style="margin-top:14px">Demo access: <b>admin / admin</b>. Change credentials from User Management.</div>
  </div></div>`;
  document.getElementById('loginForm').onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.target);
    if(fd.get('u')===state.auth.user && fd.get('p')===state.auth.pass){sessionStorage.setItem('rst_auth','1');renderApp()}else toast('Invalid username or password');
  };
}

let posIsDealer=false;
function togglePosCustomerType(val){
  posIsDealer=(val==='dealer');
  const sel=document.getElementById('posCustomer');
  if(posIsDealer){
    sel.innerHTML=state.dealers.map(d=>`<option value="${esc(d.name)}" data-margin="${d.margin}">${esc(d.name)} (${d.tier} - ${d.margin}%)</option>`).join('')||'<option>No Dealers Available</option>';
    document.getElementById('dealerNotice')?.classList.remove('hidden');
  } else {
    sel.innerHTML=`<option>Walk-in Customer</option>`+state.customers.filter(c=>c.name!=='Walk-in Customer').map(c=>`<option>${esc(c.name)}</option>`).join('');
    document.getElementById('dealerNotice')?.classList.add('hidden');
  }
  renderCart();
}
function renderPOSProducts(q=''){
  const el=document.getElementById('posProducts');if(!el)return;
  q=q.toLowerCase();
  const arr=state.items.filter(i=>`${i.name} ${i.sku} ${i.barcode}`.toLowerCase().includes(q));
  el.innerHTML=arr.map(i=>`<button class="btn" style="text-align:left;padding:13px;height:100%" onclick="cartAdd(${i.id})"><div style="font-weight:900">${esc(i.name)}</div><div class="small muted">${esc(i.sku)} · Stock ${i.stock}</div><div style="margin-top:8px;font-weight:900;color:var(--brand)">${money(i.price)}</div></button>`).join('')||'<div class="empty">No matching products.</div>';
  renderCart();
}
let cart=[];
function cartAdd(id){
  const i=state.items.find(x=>x.id===id);if(!i)return;
  if(i.stock<=0&&!state.settings.negativeStock)return toast('Out of stock');
  
  // Apply dealer margin discount if dealer selected
  let finalPrice=i.price;
  if(posIsDealer){
    const dealerName=document.getElementById('posCustomer')?.value;
    const dealerObj=state.dealers.find(d=>d.name===dealerName);
    if(dealerObj&&dealerObj.margin>0){
      finalPrice=i.price*(1-(dealerObj.margin/100));
    }
  }

  const x=cart.find(c=>c.itemId===id);
  if(x)x.qty++;else cart.push({itemId:id,name:i.name,qty:1,price:finalPrice,basePrice:i.price});
  renderCart();
}
function clearCart(){cart=[];renderCart()}
function renderCart(){
  const el=document.getElementById('cartBox');if(!el)return;
  const sub=sum(cart,x=>x.qty*x.price),tax=sub*state.settings.tax,total=sub+tax;
  el.innerHTML=`<div class="table-wrap"><table style="min-width:0"><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr></thead><tbody>${cart.map((x,idx)=>`<tr><td>${esc(x.name)}</td><td><div class="toolbar"><button class="btn" onclick="cartQty(${idx},-1)">−</button><b>${x.qty}</b><button class="btn" onclick="cartQty(${idx},1)">+</button></div></td><td>${money(x.qty*x.price)}</td><td><button class="btn bad" onclick="cartRemove(${idx})">✕</button></td></tr>`).join('')}</tbody></table></div>
  <div style="margin-top:12px" class="right"><div>Subtotal: <b>${money(sub)}</b></div><div>Tax: <b>${money(tax)}</b></div><h2 style="margin:7px 0">Total: ${money(total)}</h2><button class="btn primary" onclick="completePOS()">Complete Sale & Invoice</button></div>`;
}
function cartQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function cartRemove(i){cart.splice(i,1);renderCart()}
function completePOS(){
  if(!cart.length)return toast('Cart is empty');
  const customer=document.getElementById('posCustomer').value,method=document.getElementById('posMethod').value;
  const sub=sum(cart,x=>x.qty*x.price),tax=sub*state.settings.tax,total=sub+tax;
  for(const l of cart){const it=state.items.find(x=>x.id===l.itemId);if(it&&!state.settings.negativeStock&&it.stock<l.qty)return toast(`Insufficient stock: ${it.name}`)}
  const inv={id:uid(),no:nextNo('invoice'),customer,date:today(),due:today(),status:method==='Credit / Ledger'?'Unpaid':'Paid',subtotal:sub,tax,total,paid:method==='Credit / Ledger'?0:total,method:method==='Credit / Ledger'?'Credit':method,lines:cart.map(x=>({...x}))};
  state.invoices.unshift(inv);
  cart.forEach(l=>{const it=state.items.find(x=>x.id===l.itemId);if(it)it.stock-=l.qty});
  if(inv.paid) state.payments.unshift({id:uid(),receipt:nextNo('receipt'),invoice:inv.no,customer,date:today(),amount:inv.paid,method:inv.method,reference:'POS',notes:''});
  
  if(posIsDealer){
    const dObj=state.dealers.find(d=>d.name===customer);
    if(dObj && method==='Credit / Ledger'){
      dObj.balance+=total;
    }
  }

  log(`POS sale ${inv.no} created for ${customer} (${money(total)})`);save();toast('Sale completed');clearCart();showPage('invoices');
}
function nextNo(type){
  const y=new Date().getFullYear();
  const arr=type==='invoice'?state.invoices:type==='quote'?state.quotes:type==='order'?state.orders:type==='receipt'?state.payments:type==='credit'?state.creditNotes:type==='dealer'?state.dealers:type==='telecom'?state.telecomBills:type==='utility'?state.utilityBills:[];
  const prefix=type==='invoice'?state.settings.invoicePrefix:type==='quote'?state.settings.quotePrefix:type==='order'?state.settings.orderPrefix:type==='receipt'?state.settings.receiptPrefix:type==='credit'?state.settings.creditPrefix:type==='dealer'?state.settings.dealerPrefix:'B-';
  return `${prefix}${y}-${String(arr.length+1).padStart(3,'0')}`;
}

function processTelecomPayment(){
  const fd=new FormData(document.getElementById('telForm'));
  const provider=fd.get('provider'), serviceType=fd.get('serviceType'), accountNo=fd.get('accountNo'), customerName=fd.get('customerName')||'Walk-in', amount=num(fd.get('amount')), commission=num(fd.get('commission'));
  if(amount<=0)return toast('Enter valid amount');

  const rec={id:uid(),ref:nextNo('telecom'),provider,serviceType,accountNo,customerName,amount,commission,date:today(),status:'Paid'};
  state.telecomBills.unshift(rec);
  
  // Record revenue in accounting/expense/income ledger as well
  state.payments.unshift({id:uid(),receipt:nextNo('receipt'),invoice:'TEL-'+rec.ref,customer:customerName,date:today(),amount:amount+commission,method:'Cash',reference:`Telecom: ${provider} (${accountNo})`,notes:`Commission earned: ${money(commission)}`});
  
  log(`Telecom payment processed for ${provider}: ${money(amount)} (+ ${money(commission)} fee)`);
  save();closeModal();toast('Telecom transaction successful');showPage('telecom');
}

function processUtilityPayment(){

  const utility=fd.get('utility'), accountNo=fd.get('accountNo'), customerName=fd.get('customerName')||'Walk-in', amount=num(fd.get('amount')), commission=num(fd.get('commission'));

  const rec={id:uid(),ref:nextNo('utility'),utility,accountNo,customerName,amount,commission,date:today(),status:'Paid'};

function saveDealer(id){
  const fd=new FormData(document.getElementById('dealerForm'));
  const name=(fd.get('name')||'').trim();if(!name)return toast('Dealer name required');
  const tier=fd.get('tier'), margin=num(fd.get('margin')), balance=num(fd.get('balance')), phone=fd.get('phone'), email=fd.get('email'), address=fd.get('address');

  if(id){
    const d=state.dealers.find(x=>x.id===id);
    if(d){d.name=name;d.tier=tier;d.margin=margin;d.balance=balance;d.phone=phone;d.email=email;d.address=address;}
    toast('Dealer updated');
  } else {
    state.dealers.push({id:uid(),code:'D'+String(state.dealers.length+1).padStart(4,'0'),name,tier,margin,balance,phone,email,address});
    toast('Dealer created');
  }
  save();closeModal();showPage('dealers');
}

    ${htmlField('Notes','notes','')}
  </div></form>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDoc('${type}')">Save</button>`);
}
function saveDoc(type){
  const fd=new FormData(document.getElementById('docForm')), customer=fd.get('customer');
  const lines=[];['1','2'].forEach(n=>{const id=fd.get('item'+n);if(id){const it=state.items.find(x=>String(x.id)===String(id));const qty=num(fd.get('qty'+n));const price=num(fd.get('price'+n));if(it&&qty>0)lines.push({itemId:it.id,name:it.name,qty,price})}});
  if(!lines.length)return toast('Add at least one line item');
  const subtotal=sum(lines,x=>x.qty*x.price),tax=subtotal*state.settings.tax,total=subtotal+tax;
  const obj={id:uid(),no:nextNo(type),customer,date:today(),status:type==='invoice'?'Unpaid':'Pending',subtotal,tax,total,lines,notes:fd.get('notes')||''};
  if(type==='quote'){obj.valid=fd.get('date')||today();state.quotes.unshift(obj);log(`Quote ${obj.no} created`)}
  if(type==='order'){obj.source='Manual';state.orders.unshift(obj);log(`Sales order ${obj.no} created`)}
  if(type==='invoice'){obj.due=fd.get('date')||today();obj.paid=0;obj.method='Unpaid';state.invoices.unshift(obj);log(`Invoice ${obj.no} created`)}
  save();closeModal();toast(`${type} saved`);showPage(type==='quote'?'quotes':type==='order'?'orders':'invoices');
}
function quoteToOrder(id){
  const q=state.quotes.find(x=>x.id===id);if(!q)return;
  const o={id:uid(),no:nextNo('order'),customer:q.customer,date:today(),status:'Confirmed',subtotal:q.subtotal,tax:q.tax,total:q.total,source:q.no,lines:q.lines};
  state.orders.unshift(o);q.status='Accepted';save();log(`Quote ${q.no} converted to ${o.no}`);toast('Converted to sales order');showPage('orders');
}
function orderToInvoice(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const i={id:uid(),no:nextNo('invoice'),customer:o.customer,date:today(),due:today(),status:'Unpaid',subtotal:o.subtotal,tax:o.tax,total:o.total,paid:0,method:'Unpaid',lines:o.lines};
  state.invoices.unshift(i);o.status='Invoiced';save();log(`Order ${o.no} converted to ${i.no}`);toast('Invoice created');showPage('invoices');
}

function payInvoice(id){
  const i=state.invoices.find(x=>x.id===id);if(!i)return;
  openModal(`Receive Payment — ${i.no}`,`<form id="payForm"><div class="form-grid">${htmlField('Invoice','invoice',i.no)}${htmlField('Customer','customer',i.customer)}${htmlField('Amount','amount',totalInvoiceBalance(i),'number','step="0.001" max="'+totalInvoiceBalance(i)+'"')}${selectField('Method','method',['Cash','Card','Bank Transfer','Cheque'])}${htmlField('Reference','reference','')}${htmlField('Date','date',today(),'date')}</div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment(${id})">Apply Payment</button>`);
}
function savePayment(id){
  const fd=new FormData(document.getElementById('payForm')),i=state.invoices.find(x=>x.id===id),amt=num(fd.get('amount'));
  if(!i||amt<=0)return toast('Enter a valid amount');
  const bal=totalInvoiceBalance(i);if(amt>bal+0.0001)return toast('Payment exceeds balance');
  i.paid+=amt;i.status=(i.paid>=i.total-0.0001)?'Paid':'Partially Paid';i.method=fd.get('method');
  state.payments.unshift({id:uid(),receipt:nextNo('receipt'),invoice:i.no,customer:i.customer,date:fd.get('date')||today(),amount:amt,method:fd.get('method'),reference:fd.get('reference')||'',notes:''});
  log(`Payment ${money(amt)} received for ${i.no}`);save();closeModal();toast('Payment applied');showPage('payments');
}

function receiveStock(e){e.preventDefault();const fd=new FormData(e.target),name=fd.get('item'),it=state.items.find(x=>x.name===name),q=num(fd.get('qty'));if(!it||q<=0)return;it.stock+=q;log(`Received ${q} ${it.unit} of ${it.name}`);save();toast('Stock received');showPage('stock')}
function transferStock(e){e.preventDefault();const fd=new FormData(e.target),name=fd.get('item'),it=state.items.find(x=>x.name===name),q=num(fd.get('qty'));if(!it||q<=0)return;if(it.stock<q)return toast('Insufficient stock');it.stock-=q;state.transfers.unshift({id:uid(),date:today(),item:it.name,qty:q,from:fd.get('from'),to:fd.get('to'),ref:''});log(`Transferred ${q} of ${it.name}`);save();toast('Transfer recorded');showPage('stock')}
function returnStock(e){e.preventDefault();const fd=new FormData(e.target),name=fd.get('item'),it=state.items.find(x=>x.name===name),q=num(fd.get('qty'));if(!it||q<=0)return;if(it.stock<q)return toast('Insufficient stock');it.stock-=q;log(`Returned ${q} of ${it.name} to supplier`);save();toast('Return recorded');showPage('stock')}

function agingRows(){
  const now=new Date();
  return state.customers.map(c=>{
    let cur=0,a30=0,a60=0,a61=0;
    state.invoices.filter(i=>i.customer===c.name&&totalInvoiceBalance(i)>0).forEach(i=>{const d=Math.max(0,Math.floor((now-new Date(i.due))/86400000));const b=totalInvoiceBalance(i);if(d<=0)cur+=b;else if(d<=30)a30+=b;else if(d<=60)a60+=b;else a61+=b});
    const total=cur+a30+a60+a61;if(!total)return '';return `<tr><td>${esc(c.name)}</td><td>${money(cur)}</td><td>${money(a30)}</td><td>${money(a60)}</td><td>${money(a61)}</td><td><b>${money(total)}</b></td></tr>`;

}

let csvRows=[];
function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length)return [];
  return lines.map(line=>{
    const out=[];let cur='',q=false;
    for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}
    out.push(cur);return out;
  });
}
function readCSV(){
  const f=document.getElementById('csvFile')?.files?.[0];if(!f)return toast('Select CSV file');
  const type=document.getElementById('csvType').value;const r=new FileReader();
  r.onload=()=>{const rows=parseCSV(r.result);csvRows=rows;const head=rows[0]||[];const sample=rows.slice(1,5);
    document.getElementById('csvPreview').innerHTML=`<div class="small muted">Detected ${rows.length-1} data rows. Target: <b>${type}</b></div><div class="table-wrap" style="margin-top:10px"><table style="min-width:0"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${sample.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="downloadTemplate('${type}')">Download Template</button><button class="btn primary" onclick="importCSV('${type}')">Import ${rows.length-1} Rows</button></div>`;
  };r.readAsText(f);
}
function normalize(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_')}
function importCSV(type){
  if(!csvRows.length)return;const h=csvRows[0].map(normalize);
  csvRows.slice(1).forEach(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]||'');
    if(type==='items')state.items.push({id:uid(),sku:o.sku||'CSV-'+uid().toString().slice(-5),name:o.name||o.item||'Imported Item',category:o.category||'Accessories',location:o.location||'Main Store',cost:num(o.cost),price:num(o.price||o.sale_price),stock:num(o.stock||o.quantity),reorder:num(o.reorder||5),barcode:o.barcode||'',serialTrack:false,unit:o.unit||'pcs',taxable:true});
    if(type==='customers')state.customers.push({id:uid(),code:o.code||'C'+String(state.customers.length+1).padStart(4,'0'),name:o.name||'Imported Customer',phone:o.phone||'',email:o.email||'',group:o.group||'Retail',credit:num(o.credit_limit||o.credit),balance:num(o.balance),address:o.address||'',salesperson:o.salesperson||'Admin'});
    if(type==='suppliers')state.suppliers.push({id:uid(),code:o.code||'S'+String(state.suppliers.length+1).padStart(4,'0'),name:o.name||'Imported Supplier',phone:o.phone||'',email:o.email||'',balance:num(o.balance),address:o.address||''});
    if(type==='dealers')state.dealers.push({id:uid(),code:o.code||'D'+String(state.dealers.length+1).padStart(4,'0'),name:o.name||'Imported Dealer',phone:o.phone||'',email:o.email||'',tier:o.tier||'Tier 1 (Wholesale)',margin:num(o.margin||10),balance:num(o.balance),address:o.address||''});
  });
  save();toast(`${csvRows.length-1} rows imported`);csvRows=[];showPage(type==='items'?'inventory':type==='customers'?'customers':type==='suppliers'?'suppliers':'dealers');
}

  q=q.toLowerCase().trim();if(!q)return;
  const hits=[];
  state.customers.forEach(x=>`${x.name} ${x.phone}`.toLowerCase().includes(q)&&hits.push(`Customer: ${x.name}`));
  state.dealers.forEach(x=>`${x.name} ${x.phone}`.toLowerCase().includes(q)&&hits.push(`Dealer: ${x.name} (${x.tier})`));
  state.items.forEach(x=>`${x.name} ${x.sku} ${x.barcode}`.toLowerCase().includes(q)&&hits.push(`Item: ${x.name}`));
  state.invoices.forEach(x=>`${x.no} ${x.customer}`.toLowerCase().includes(q)&&hits.push(`Invoice: ${x.no} · ${x.customer}`));
  state.telecomBills.forEach(x=>`${x.ref} ${x.provider} ${x.accountNo}`.toLowerCase().includes(q)&&hits.push(`Telecom: ${x.provider} (${x.accountNo})`));
  const box=document.getElementById('content');if(box&&hits.length)box.insertAdjacentHTML('afterbegin',`<div class="card" style="margin-bottom:12px"><div class="card-head"><b>Search Results</b><button class="btn" onclick="this.closest('.card').remove()">Close</button></div><div class="card-body"><div class="list">${hits.slice(0,12).map(h=>`<div class="list-row">${esc(h)}<span>•</span></div>`).join('')}</div></div></div>`);
}
function customerFromName(n){return state.customers.find(c=>c.name===n)}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus()}
  if(e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();quickNew('invoice')}
  if(e.key==='F2'){e.preventDefault();showPage('pos')}
  if(e.key==='Escape'&&modalOpen)closeModal()
});
